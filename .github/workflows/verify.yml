name: Verify recorded results
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt
      - run: python code/verify_results.py
      - run: python code/review_audit.py
      - run: python code/verify_scale.py
      - run: python code/verify_external.py
      - run: python -m unittest discover -s code -p test_research_integrity.py -v
      - run: python code/evidence_audit_diagnostics.py --out /tmp/caea-auditor-diagnostics
